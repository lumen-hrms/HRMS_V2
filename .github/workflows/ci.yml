name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API — lint, unit + e2e tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms_superuser
          POSTGRES_PASSWORD: hrms_superuser_pw
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms_superuser -d hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://hrms_superuser:hrms_superuser_pw@localhost:5432/hrms?schema=public
      TENANT_DATABASE_URL: postgresql://hrms_app:hrms_app_pw@localhost:5432/hrms?schema=public
      PLATFORM_DATABASE_URL: postgresql://hrms_platform:hrms_platform_pw@localhost:5432/hrms?schema=platform
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      MFA_ISSUER: HRMS Platform CI
      TENANT_RESOLUTION_MODE: header
      NODE_ENV: test
      PORT: 3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: hrms-documents-ci
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations (creates hrms_app/hrms_platform roles + RLS policies)
        run: npm run prisma:migrate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Tenant-isolation + auth e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck via tsc -b)
        run: npm run build
