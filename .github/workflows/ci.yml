name: CI

on:
  pull_request:
  push:
    branches: [main]

# api-lint / api-unit / api-build need nothing but the checked-out repo —
# splitting them out of the old single serial job lets them run in parallel
# with each other and with api-e2e (the only job that needs live Postgres +
# Redis + real Firebase), instead of lint→unit→e2e→build one after another.
# Wall-clock time is roughly max(job time), not sum(job time).
jobs:
  api-lint:
    name: API — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - run: npm run lint

  api-unit:
    name: API — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Unit tests
        run: npm test -- --ci

  api-build:
    name: API — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - run: npm run build

  api-e2e:
    name: API — e2e tests (tenant isolation + auth + identity & access)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms_superuser
          POSTGRES_PASSWORD: hrms_superuser_pw
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms_superuser -d hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Leave module's BullMQ queue (leave-escalation/leave-accrual processors)
      # connects at app bootstrap — without this, app.init() hangs waiting on
      # Redis and every e2e suite times out in beforeAll, regardless of what
      # it actually tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://hrms_superuser:hrms_superuser_pw@localhost:5432/hrms?schema=public
      TENANT_DATABASE_URL: postgresql://hrms_app:hrms_app_pw@localhost:5432/hrms?schema=public
      PLATFORM_DATABASE_URL: postgresql://hrms_platform:hrms_platform_pw@localhost:5432/hrms?schema=platform
      REDIS_URL: redis://localhost:6379
      # Real Firebase — no emulator. These must be set as repo secrets:
      #   FIREBASE_PROJECT_ID          – the project id (e.g. a dedicated *-ci project)
      #   FIREBASE_WEB_API_KEY         – Project settings > General > Web API Key
      #   FIREBASE_SERVICE_ACCOUNT_JSON – the service-account JSON blob, one line
      # e2e tests create users named e2e-*@example.test and delete them in afterAll.
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      TENANT_RESOLUTION_MODE: header
      NODE_ENV: test
      PORT: 3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: hrms-documents-ci
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations (creates hrms_app/hrms_platform roles + RLS policies)
        run: npm run prisma:migrate

      - name: E2E tests
        run: npm run test:e2e

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck via tsc -b)
        run: npm run build
