version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_superuser
      POSTGRES_PASSWORD: hrms_superuser_pw
      POSTGRES_DB: hrms
    ports:
      - "5432:5432"
    volumes:
      - hrms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_superuser -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hrms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hrms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrms_minio
      MINIO_ROOT_PASSWORD: hrms_minio_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hrms_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Malware scanner for every uploaded document (module 09). Uploads stay
  # undownloadable ("Scanning…") until clamd has checked them, so this must
  # be up for documents to become usable. First start downloads the
  # signature DB (~1-2 min); needs ~1.5 GB RAM.
  clamav:
    image: clamav/clamav:stable
    container_name: hrms_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - hrms_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  hrms_pg_data:
  hrms_minio_data:
  hrms_redis_data:
  hrms_clamav_data:
